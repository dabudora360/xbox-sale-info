name: Xboxセール情報 自動更新

# 毎日 09:30（日本時間）に自動実行。GitHub のスケジュールは UTC 指定なので 00:30 UTC = 09:30 JST
# Actions タブから手動実行（workflow_dispatch）も可能
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sale-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: セール情報を取得して index.html を更新
        run: node scripts/update.mjs

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html price-history.json
          if git diff --cached --quiet; then
            echo '変更なし'
          else
            git commit -m 'セール情報を自動更新'
            git push
          fi
